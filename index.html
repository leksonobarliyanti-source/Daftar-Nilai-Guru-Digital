<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daftar Nilai Guru Digital</title>
<style>
:root{--bg:#F4F7F7;--card:#fff;--ink:#12262B;--mut:#58707A;--line:#D3DEE0;--pri:#0E5A6B;--on:#fff;--soft:#E8F3F5;--bad:#B3261E;--warn:#8A5A00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1D;--card:#17262A;--ink:#E6F0F2;--mut:#9BB2B8;--line:#2B4046;--pri:#5CC2D6;--on:#06222A;--soft:#1B3238;--bad:#FF8A80;--warn:#F2C26B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A1D;--card:#17262A;--ink:#E6F0F2;--mut:#9BB2B8;--line:#2B4046;--pri:#5CC2D6;--on:#06222A;--soft:#1B3238;--bad:#FF8A80;--warn:#F2C26B;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.45 Roboto,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:10}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--pri);color:var(--on);padding:8px 10px 0}
#top b{font-size:1.05rem}#top small{float:right;opacity:.85}
#nv{display:flex;gap:4px;overflow-x:auto;padding:8px 0}
#nv button{flex:0 0 auto;border:0;border-radius:99px;padding:8px 14px;background:transparent;color:var(--on);font:inherit;cursor:pointer}
#nv button.on{background:var(--on);color:var(--pri);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:12px}
h2{margin:.2rem 0 .6rem;font-size:1.25rem}h3{margin:.8rem 0 .4rem;font-size:1.02rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st b{display:block;font-size:1.8rem;color:var(--pri);line-height:1.1}
.mut{color:var(--mut);font-size:.9rem}.bad{color:var(--bad)}.warn{color:var(--warn)}
label{display:block;font-weight:600;font-size:.88rem}
input,select,textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin-top:3px}
textarea{min-height:80px}td input,td select{margin:0;min-width:70px}
.b{min-height:40px;padding:8px 14px;border:0;border-radius:8px;background:var(--pri);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
.b.g2{background:transparent;color:var(--pri);border:1px solid var(--pri)}.b.d{background:var(--bad);color:#fff}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:6px 0}.r>*{flex:1 1 130px}.r>.b{flex:0 0 auto}
.sc,.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--soft);font-size:.85rem;white-space:nowrap}
.ban{padding:8px 12px;border-radius:8px;background:var(--soft);margin-bottom:8px}
#md{position:fixed;inset:0;display:none;background:rgba(0,0,0,.5);z-index:30;align-items:center;justify-content:center;padding:14px}
#md>div{background:var(--card);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
#tt{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;display:none;z-index:40}
.kop,.ttd,#cl{display:none}.kop{text-align:center;border-bottom:2px solid #000;margin-bottom:10px}
body.pv #top,body.pv .np{display:none}body.pv .kop,body.pv .ttd{display:block}body.pv #cl{display:block;position:fixed;right:12px;top:12px;z-index:20}
body.pv .card{border:0;padding:0}body.pv{background:#fff;color:#000}
.ttd{margin:24px 0 0 auto;width:220px;text-align:center}
@media print{#top,.np,#cl,body::before{display:none!important}.kop,.ttd{display:block}body{background:#fff;color:#000}.card{border:0;padding:0}main{padding:0}table{min-width:0;font-size:12px}@page{size:A4}}
</style>
</head>
<body>
<div id="top"><b>Daftar Nilai Guru Digital</b><small id="st">Memuat…</small><div id="nv"></div></div>
<main id="v"></main>
<div id="md"></div><div id="tt"></div><button id="cl" class="b" onclick="document.body.classList.remove('pv')">Tutup pratinjau</button>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>v===undefined||v===null||v===''?null:+v,mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,f1=v=>v==null?'—':String(Math.round(v*10)/10).replace('.',',');
const DEF=()=>({prof:{guru:'',nip:'',sekolah:'',jenjang:'SMP/MTs',tahun:'',semester:'Ganjil',fase:'D',kelas:'',mapel:'',tempat:'',batas:75,cp:''},siswa:[],komp:[['Tugas',20],['LKPD',15],['Kuis',15],['Praktik/Proyek',20],['Sumatif',30]].map(k=>({id:uid(),nama:k[0],bobot:k[1],pakai:1})),tp:[],ases:[],desk:{},bk:0});
let db=DEF(),V='dash',selA=null,fl={q:'',sort:'absen',j:''},tm;
/* ---- penyimpanan IndexedDB ---- */
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('dnk',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function ld(){try{const d=await idb();return await new Promise(r=>{const g=d.transaction('kv').objectStore('kv').get('db');g.onsuccess=()=>r(g.result);g.onerror=()=>r(null)})}catch(e){return null}}
function sv(){clearTimeout(tm);tm=setTimeout(async()=>{try{const d=await idb();await new Promise((r,j)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(JSON.parse(JSON.stringify(db)),'db');t.oncomplete=r;t.onerror=j});$('#st').textContent='Tersimpan '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}catch(e){$('#st').textContent='Penyimpanan gagal: data tidak permanen'}},300)}
/* ---- bantu ---- */
const P=(k,v)=>{db.prof[k]=v;sv()},tt=m=>{const e=$('#tt');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',3000)};
const md=h=>{$('#md').innerHTML='<div>'+h+'</div>';$('#md').style.display='flex'},mc=()=>$('#md').style.display='none';
const cf=(m,fn)=>{window._f=fn;md(`<p>${m}</p><div class="r"><button class="b d" onclick="mc();_f()">Ya, lanjutkan</button><button class="b g2" onclick="mc()">Batal</button></div>`)};
const go=v=>{V=v;fl.q='';render();scrollTo(0,0)};
function xp(name,text){window._t=text;window._n=name;md(`<h3>${esc(name)}</h3><textarea id="xt" readonly style="min-height:160px">${esc(text)}</textarea><div class="r"><button class="b" onclick="dl()">Unduh</button><button class="b g2" onclick="navigator.clipboard.writeText(_t).then(()=>tt('Disalin'),()=>{$('#xt').select();tt('Tekan lama lalu Salin')})">Salin</button><button class="b g2" onclick="mc()">Tutup</button></div><p class="mut">Jika unduhan tidak berjalan di lingkungan ini, gunakan Salin lalu tempel ke Excel/Notepad.</p>`)}
function dl(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([_t],{type:'text/plain;charset=utf-8'}));a.download=_n;document.body.appendChild(a);a.click();a.remove()}catch(e){tt('Unduhan tidak tersedia')}}
const csv=(h,rows)=>'\ufeff'+[h,...rows].map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
/* ---- perhitungan ---- */
const totB=()=>db.komp.filter(k=>k.pakai).reduce((s,k)=>s+ +k.bobot,0),okB=()=>Math.abs(totB()-100)<.001;
const avgK=(sid,kid)=>mean(db.ases.filter(a=>a.komp===kid&&a.masuk).map(a=>num(a.nil[sid])).filter(v=>v!=null));
function akhir(sid){if(!okB())return{err:'Total bobot '+totB()+'% (harus 100%)'};let t=0,det=[],miss=[];db.komp.filter(k=>k.pakai&&+k.bobot>0).forEach(k=>{const m=avgK(sid,k.id);if(m==null)miss.push(k.nama);else{det.push([k.nama,m,k.bobot,m*k.bobot/100]);t+=m*k.bobot/100}});return miss.length?{miss,det}:{v:t,det}}
const tpM=(sid,tid)=>mean(db.ases.filter(a=>a.tp===tid).map(a=>num(a.nil[sid])).filter(v=>v!=null)),cm=a=>mean(db.siswa.map(s=>num(a.nil[s.id])).filter(v=>v!=null));
const needs=sid=>db.tp.filter(t=>num(t.min)!=null&&tpM(sid,t.id)!=null&&tpM(sid,t.id)<+t.min);
const tpN=t=>t.kode||t.teks.slice(0,30),srt=()=>{const q=fl.q.toLowerCase();let L=db.siswa.filter(s=>!q||(s.nama+s.nis).toLowerCase().includes(q));return L.sort((a,b)=>fl.sort=='nama'?a.nama.localeCompare(b.nama):fl.sort=='nilai'?(akhir(b.id).v??-1)-(akhir(a.id).v??-1):(+a.absen||999)-(+b.absen||999)||a.nama.localeCompare(b.nama))};
function bars(L,Vs,mx){if(!Vs.length)return'<p class="mut">Belum ada data.</p>';const w=Math.max(300,Vs.length*58);return`<div class="sc"><svg viewBox="0 0 ${w} 170" width="${w}" role="img">`+Vs.map((v,i)=>{const h=v==null?0:v/mx*105,x=i*58+10;return`<rect x="${x}" y="${130-h}" width="38" height="${h}" rx="4" fill="var(--pri)"/><text x="${x+19}" y="${124-h}" text-anchor="middle" font-size="11" fill="var(--ink)">${f1(v)}</text><text x="${x+19}" y="148" text-anchor="middle" font-size="10" fill="var(--mut)">${esc(String(L[i]).slice(0,9))}</text>`}).join('')+'</svg></div>'}
const kop=()=>{const p=db.prof;return`<div class="kop"><h2>${esc(p.sekolah||'Nama Sekolah')}</h2><p>Guru: ${esc(p.guru)}${p.nip?' (NIP/NUPTK '+esc(p.nip)+')':''} · Mapel: ${esc(p.mapel)} · Kelas ${esc(p.kelas)} · Fase ${esc(p.fase)} · Semester ${esc(p.semester)} · Tahun Pelajaran ${esc(p.tahun)}</p></div>`},ttd=()=>`<div class="ttd"><p>${esc(db.prof.tempat)}, ${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</p><p>Guru Mata Pelajaran</p><br><br><p><u>${esc(db.prof.guru)}</u></p></div>`;
const pvb=()=>`<button class="b g2 np" onclick="document.body.classList.add('pv')">Pratinjau cetak</button><button class="b g2 np" onclick="try{window.print()}catch(e){tt('Cetak tidak tersedia di sini')}">Cetak</button>`;
/* ---- tampilan ---- */
const NAV=[['dash','Dashboard'],['set','Pengaturan'],['sis','Peserta Didik'],['nil','Penilaian'],['rek','Rekap & Bobot'],['ana','Analisis'],['des','Deskripsi'],['cad','Cadangan']];
function render(){$('#nv').innerHTML=NAV.map(n=>`<button class="${n[0]==V?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');$('#v').innerHTML=VW[V]()}
const VW={dash(){const sd=db.siswa,ak=sd.map(s=>akhir(s.id).v).filter(v=>v!=null),perlu=sd.filter(s=>needs(s.id).length).length,kl=new Set(sd.map(s=>s.kelas).filter(Boolean)).size||(db.prof.kelas?1:0),mp=db.prof.mapel.split(',').filter(x=>x.trim()).length,L=db.ases.slice().sort((a,b)=>(a.tgl||'').localeCompare(b.tgl||'')),w=[];
 if(!db.prof.guru||!db.prof.sekolah)w.push('Identitas guru dan sekolah belum lengkap.');if(!okB())w.push('Total bobot '+totB()+'% (harus 100%).');if(!db.tp.length)w.push('Tujuan Pembelajaran belum diisi.');if(!sd.length)w.push('Data peserta didik masih kosong.');db.ases.forEach(a=>{const n=sd.filter(s=>num(a.nil[s.id])==null).length;if(n)w.push(`${esc(a.nama)}: ${n} nilai belum diisi.`)});
 const st=(n,l)=>`<div class="card st"><b>${n}</b><span class="mut">${l}</span></div>`;
 return`<h2>Solusi Praktis Pengelolaan Nilai Peserta Didik Berbasis Kurikulum Merdeka</h2><p class="mut">${esc(db.prof.guru||'[Nama Guru]')} · ${esc(db.prof.sekolah||'[Nama Sekolah]')} · ${esc(db.prof.tahun||'[Tahun Pelajaran]')}</p><div class="g">${st(sd.length,'Peserta didik')}${st(kl,'Kelas')}${st(mp,'Mata pelajaran')}${st(db.komp.filter(k=>k.pakai).length,'Komponen penilaian')}${st(f1(mean(ak)),'Rata-rata nilai akhir')}${st(perlu,'Perlu tindak lanjut')}</div>
 <div class="card"><h3>Rata-rata kelas per penilaian</h3>${bars(L.map(a=>a.nama),L.map(cm),100)}</div><div class="card"><h3>Informasi yang belum lengkap</h3>${w.length?w.map(x=>`<div class="ban">${x}</div>`).join(''):'<p class="mut">Semua data utama sudah lengkap.</p>'}</div>`},
set(){const p=db.prof,f=(k,l,t='text')=>`<label>${l}<input type="${t}" value="${esc(p[k])}" onchange="P('${k}',this.value)"></label>`,s=(k,l,o)=>`<label>${l}<select onchange="P('${k}',this.value)">${o.map(x=>`<option ${x==p[k]?'selected':''}>${x}</option>`).join('')}</select></label>`;
 return`<h2>Pengaturan</h2><div class="card"><h3>Identitas guru dan sekolah</h3><div class="r">${f('guru','Nama guru')}${f('nip','NIP/NUPTK (jika ada)')}${f('sekolah','Nama sekolah')}${f('tempat','Tempat penandatanganan')}</div><div class="r">${s('jenjang','Jenjang',['PAUD/TK','SD/MI','SMP/MTs','SMA/MA','SMK/MAK','Kesetaraan'])}${s('fase','Fase',['Fondasi','A','B','C','D','E','F'])}${f('kelas','Kelas/tingkat')}${f('mapel','Mata pelajaran (pisahkan koma)')}${f('tahun','Tahun pelajaran')}${s('semester','Semester',['Ganjil','Genap'])}</div><p class="mut">Kurikulum: Kurikulum Merdeka. ${p.jenjang=='PAUD/TK'?'Untuk PAUD/TK, nilai angka bersifat opsional; gunakan kolom catatan pada menu Penilaian sebagai observasi atau catatan anekdot.':'Semua isian bersifat fleksibel dan dapat disesuaikan dengan kebijakan satuan pendidikan.'}</p></div>
 <div class="card"><h3>Capaian Pembelajaran (CP)</h3><textarea onchange="P('cp',this.value)">${esc(p.cp)}</textarea></div>
 <div class="card"><h3>Komponen penilaian dan bobot</h3><p class="mut">Contoh awal dapat diubah. Total bobot komponen yang dipakai harus 100%. Rumus ini hanya contoh teknis, bukan ketentuan wajib kurikulum.</p><div class="tw"><table><tr><th>Komponen</th><th>Bobot (%)</th><th>Dipakai</th><th></th></tr>${db.komp.map(k=>`<tr><td><input value="${esc(k.nama)}" onchange="KC('${k.id}','nama',this.value)"></td><td><input type="number" min="0" max="100" value="${k.bobot}" onchange="KC('${k.id}','bobot',this.value)"></td><td><input type="checkbox" style="min-width:0" ${k.pakai?'checked':''} onchange="KC('${k.id}','pakai',this.checked?1:0)"></td><td><button class="b d" onclick="cf('Hapus komponen ini beserta keterkaitannya dengan penilaian?',()=>{db.komp=db.komp.filter(x=>x.id!='${k.id}');sv();render()})">Hapus</button></td></tr>`).join('')}</table></div><p class="${okB()?'':'bad'}"><b>Total bobot: ${totB()}%</b> ${okB()?'(sesuai)':'(harus 100%)'}</p><button class="b" onclick="db.komp.push({id:uid(),nama:'Komponen baru',bobot:0,pakai:1});sv();render()">Tambah komponen</button></div>
 <div class="card"><h3>Tujuan Pembelajaran (TP) dan KKTP</h3><p class="mut">KKTP dapat berupa kriteria deskriptif. Batas nilai bersifat opsional dan hanya dipakai untuk menandai dukungan belajar, bukan angka ketuntasan nasional.</p><div class="tw"><table><tr><th>Kode</th><th>Tujuan Pembelajaran</th><th>Kriteria ketercapaian</th><th>Batas nilai (opsional)</th><th></th></tr>${db.tp.map(t=>`<tr><td><input value="${esc(t.kode)}" onchange="TC('${t.id}','kode',this.value)"></td><td><textarea onchange="TC('${t.id}','teks',this.value)">${esc(t.teks)}</textarea></td><td><textarea onchange="TC('${t.id}','krit',this.value)">${esc(t.krit)}</textarea></td><td><input type="number" value="${esc(t.min)}" onchange="TC('${t.id}','min',this.value)"></td><td><button class="b d" onclick="cf('Hapus TP ini?',()=>{db.tp=db.tp.filter(x=>x.id!='${t.id}');sv();render()})">Hapus</button></td></tr>`).join('')}</table></div><button class="b" onclick="db.tp.push({id:uid(),kode:'TP '+(db.tp.length+1),teks:'',krit:'',min:''});sv();render()">Tambah TP</button></div>`},
sis(){return`<h2>Data Peserta Didik</h2><div class="card np"><div class="r"><label>NIS/NISN<input id="n1"></label><label>Nama lengkap<input id="n2"></label><label>JK<select id="n3"><option>L</option><option>P</option></select></label><label>Kelas<input id="n4" value="${esc(db.prof.kelas)}"></label><label>No. absen<input id="n5" type="number"></label><label>Keterangan<input id="n6"></label><button class="b" onclick="addS()">Tambah</button></div><div class="r"><label>Impor CSV (NIS,Nama,JK,Kelas,Absen,Keterangan)<input type="file" accept=".csv,.txt" onchange="impS(this)"></label><button class="b g2" onclick="expS()">Ekspor CSV</button></div></div><div class="r np"><input placeholder="Cari nama atau NIS" value="${esc(fl.q)}" oninput="fl.q=this.value;$('#tb').innerHTML=sisR()"><select onchange="fl.sort=this.value;render()"><option value="absen" ${fl.sort=='absen'?'selected':''}>Urut nomor absen</option><option value="nama" ${fl.sort=='nama'?'selected':''}>Urut nama</option></select></div><div class="card tw"><table><thead><tr><th>No</th><th>NIS/NISN</th><th>Nama</th><th>JK</th><th>Kelas</th><th>Absen</th><th>Keterangan</th><th></th></tr></thead><tbody id="tb">${sisR()}</tbody></table></div>`},
nil(){const A=db.ases.filter(a=>!fl.j||a.jenis==fl.j).sort((a,b)=>(a.tgl||'').localeCompare(b.tgl||'')),a=db.ases.find(x=>x.id==selA),o=(L,sel)=>L.map(x=>`<option value="${x[0]}" ${x[0]==sel?'selected':''}>${esc(x[1])}</option>`).join('');
 return`<h2>Penilaian: Harian, Formatif, Sumatif</h2><div class="card np"><div class="r"><label>Nama penilaian<input id="a1" placeholder="mis. Kuis TP 1"></label><label>Jenis<select id="a2"><option>Harian</option><option>Formatif</option><option>Sumatif</option></select></label><label>Komponen<select id="a3">${o(db.komp.map(k=>[k.id,k.nama]))}</select></label><label>Tujuan Pembelajaran<select id="a4"><option value="">-</option>${o(db.tp.map(t=>[t.id,tpN(t)]))}</select></label><label>Tanggal<input id="a5" type="date"></label><button class="b" onclick="addA()">Buat</button></div><p class="mut">Formatif tidak otomatis masuk nilai akhir; atur dengan kotak centang di bawah.</p></div>
 <div class="r np"><select onchange="fl.j=this.value;render()"><option value="">Semua jenis</option>${['Harian','Formatif','Sumatif'].map(j=>`<option ${fl.j==j?'selected':''}>${j}</option>`).join('')}</select><select onchange="selA=this.value;render()"><option value="">Pilih penilaian…</option>${o(A.map(x=>[x.id,`${x.nama} (${x.jenis}${x.tgl?', '+x.tgl:''})`]),selA)}</select></div>
 ${a?`${kop()}<div class="card"><h3>${esc(a.nama)} <span class="mut">${a.jenis} · ${esc((db.komp.find(k=>k.id==a.komp)||{}).nama||'-')} · ${esc((db.tp.find(t=>t.id==a.tp)||{kode:'-'}).kode||'-')} · ${a.tgl||'tanpa tanggal'}</span></h3><label class="np"><input type="checkbox" style="width:auto;min-height:0" ${a.masuk?'checked':''} onchange="a_=db.ases.find(x=>x.id=='${a.id}');a_.masuk=this.checked;sv();tt('Disimpan')"> Masuk perhitungan nilai akhir</label><div class="tw"><table><tr><th>No</th><th>Nama</th><th>Nilai (0–100, kosong = belum diisi)</th><th>Catatan / umpan balik / tindak lanjut</th></tr>${db.siswa.slice().sort((x,y)=>(+x.absen||999)-(+y.absen||999)).map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.nama)}</td><td><input type="number" min="0" max="100" step="any" value="${esc(a.nil[s.id]??'')}" onchange="setN('${a.id}','${s.id}',this.value,this)"></td><td><input value="${esc(a.fb[s.id]||'')}" onchange="db.ases.find(x=>x.id=='${a.id}').fb['${s.id}']=this.value;sv()"></td></tr>`).join('')}</table></div><p>Rata-rata kelas: <b>${f1(cm(a))}</b> · Terisi: ${db.siswa.filter(s=>num(a.nil[s.id])!=null).length}/${db.siswa.length}</p><div class="r np">${pvb()}<button class="b d" onclick="cf('Hapus penilaian ini beserta seluruh nilainya?',()=>{db.ases=db.ases.filter(x=>x.id!='${a.id}');selA=null;sv();render()})">Hapus penilaian</button></div></div>${ttd()}`:'<p class="mut">Buat atau pilih penilaian untuk mengisi nilai.</p>'}`},
rek(){const ks=db.komp.filter(k=>k.pakai&&+k.bobot>0),L=srt();return`${kop()}<h2>Rekap Nilai Semester</h2>${okB()?'':`<div class="ban bad">Total bobot ${totB()}% (harus 100%). Nilai akhir tidak dihitung sampai bobot diperbaiki di menu Pengaturan.</div>`}<div class="r np"><input placeholder="Cari nama atau NIS" value="${esc(fl.q)}" oninput="fl.q=this.value;render()"><select onchange="fl.sort=this.value;render()">${[['absen','Urut nomor absen'],['nama','Urut nama'],['nilai','Urut nilai akhir']].map(x=>`<option value="${x[0]}" ${fl.sort==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>${pvb()}<button class="b g2" onclick="expR()">Ekspor CSV</button></div><div class="card tw"><table><tr><th>No</th><th>Nama</th>${ks.map(k=>`<th>${esc(k.nama)} (${k.bobot}%)</th>`).join('')}<th>Nilai akhir</th><th>Deskripsi capaian</th></tr>${L.map((s,i)=>{const r=akhir(s.id);return`<tr><td>${i+1}</td><td>${esc(s.nama)}</td>${ks.map(k=>`<td>${f1(avgK(s.id,k.id))}</td>`).join('')}<td>${r.v!=null?`<b>${f1(r.v)}</b> <button class="b g2 np" onclick="rin('${s.id}')">Rincian</button>`:r.miss?`<span class="warn">Belum lengkap<br><small>${esc(r.miss.join(', '))}</small></span>`:'—'}</td><td>${esc(db.desk[s.id]||'')}</td></tr>`}).join('')}</table></div><p class="mut">Nilai kosong tidak dihitung sebagai nol: nilai akhir muncul setelah semua komponen yang dipakai memiliki nilai.</p>${ttd()}`},
ana(){const sd=db.siswa,ak=sd.map(s=>akhir(s.id).v).filter(v=>v!=null),bn=[[0,59],[60,69],[70,79],[80,89],[90,100]].map(r=>ak.filter(v=>v>=r[0]&&v<=r[1]+.99).length),L=db.ases.slice().sort((a,b)=>(a.tgl||'').localeCompare(b.tgl||'')),sp=sd.map(s=>[s,needs(s.id)]).filter(x=>x[1].length);
 return`${kop()}<h2>Analisis Hasil Belajar</h2><div class="np">${pvb()}</div><div class="g"><div class="card st"><b>${f1(mean(ak))}</b><span class="mut">Rata-rata kelas</span></div><div class="card st"><b>${ak.length?f1(Math.max(...ak)):'—'}</b><span class="mut">Tertinggi</span></div><div class="card st"><b>${ak.length?f1(Math.min(...ak)):'—'}</b><span class="mut">Terendah</span></div></div>
 <div class="card"><h3>Sebaran nilai akhir (jumlah peserta didik)</h3>${bars(['<60','60–69','70–79','80–89','90–100'],bn,Math.max(...bn,1))}</div><div class="card"><h3>Perkembangan rata-rata kelas</h3>${bars(L.map(a=>a.nama),L.map(cm),100)}</div>
 <div class="card"><h3>Ketercapaian per Tujuan Pembelajaran</h3><div class="tw"><table><tr><th>TP</th><th>Rata-rata kelas</th><th>Capaian terhadap batas KKTP</th></tr>${db.tp.map(t=>{const m=sd.map(s=>tpM(s.id,t.id)).filter(v=>v!=null),has=num(t.min)!=null;return`<tr><td>${esc(tpN(t))}</td><td>${f1(mean(m))}</td><td>${!m.length?'Belum ada data':has?m.filter(v=>v>=+t.min).length+' dari '+m.length+' peserta didik telah mencapai':'Batas nilai belum diatur (kriteria deskriptif)'}</td></tr>`}).join('')}</table></div></div>
 <div class="card"><h3>Peserta didik yang membutuhkan dukungan belajar</h3>${sp.length?sp.map(x=>`<p><b>${esc(x[0].nama)}</b>: dukungan pada ${esc(x[1].map(tpN).join(', '))}</p>`).join(''):'<p class="mut">Belum ada TP yang memerlukan dukungan berdasarkan batas KKTP yang diatur.</p>'}<p class="mut">Hasil ini dipakai untuk merencanakan bantuan, bukan label bagi peserta didik. Pertimbangkan juga bukti dan catatan lain.</p></div>${ttd()}`},
des(){return`${kop()}<h2>Deskripsi Capaian Pembelajaran</h2><div class="r np"><button class="b" onclick="db.siswa.forEach(s=>{if(!db.desk[s.id])db.desk[s.id]=gen(s)||''});sv();render()">Buat semua yang kosong</button>${pvb()}</div>${srt().map(s=>`<div class="card"><b>${esc(s.nama)}</b><textarea id="d_${s.id}" onchange="db.desk['${s.id}']=this.value;sv();tt('Tersimpan')">${esc(db.desk[s.id]||'')}</textarea><div class="r np"><button class="b g2" onclick="const t=gen(db.siswa.find(x=>x.id=='${s.id}'));t?($('#d_${s.id}').value=t):0">Buat Deskripsi</button><button class="b" onclick="db.desk['${s.id}']=$('#d_${s.id}').value;sv();tt('Deskripsi disimpan')">Simpan Deskripsi</button></div></div>`).join('')||'<p class="mut">Belum ada peserta didik.</p>'}<p class="mut np">Deskripsi dibuat hanya dari nilai per TP yang sudah terisi. Edit teks sesuai pengamatan Anda sebelum disimpan.</p>${ttd()}`},
cad(){return`<h2>Pengaturan dan Cadangan Data</h2><div class="card"><p>Data tersimpan otomatis di IndexedDB peramban ini dan tetap ada setelah halaman dimuat ulang. Status: <b>${$('#st').textContent}</b>.</p><p>Cadangan terakhir: <b>${db.bk?new Date(db.bk).toLocaleString('id-ID'):'belum pernah'}</b></p><div class="r"><button class="b" onclick="db.bk=Date.now();sv();xp('cadangan-daftar-nilai-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db))">Ekspor cadangan</button><label>Impor cadangan (.json)<input type="file" accept=".json" onchange="impB(this)"></label></div></div><div class="card"><h3>Hapus semua data</h3><button class="b d" onclick="cf('Semua data akan dihapus permanen. Pastikan sudah ada cadangan.',()=>{db=DEF();sv();go('dash')})">Hapus semua data</button></div><p class="mut">Data hanya ada di peramban dan perangkat ini. Ekspor cadangan secara berkala.</p>`}};
/* ---- aksi ---- */
const KC=(id,k,v)=>{db.komp.find(x=>x.id==id)[k]=k=='bobot'?Math.max(0,+v||0):v;sv();render()},TC=(id,k,v)=>{db.tp.find(x=>x.id==id)[k]=v;sv();if(k=='min'||k=='kode')render()};
const sisR=()=>srt().map((s,i)=>{const c=(k,t='text')=>`<td><input type="${t}" value="${esc(s[k])}" onchange="Sc('${s.id}','${k}',this.value)"></td>`;return`<tr><td>${i+1}</td>${c('nis')}${c('nama')}<td><select onchange="Sc('${s.id}','jk',this.value)"><option ${s.jk=='L'?'selected':''}>L</option><option ${s.jk=='P'?'selected':''}>P</option></select></td>${c('kelas')}${c('absen','number')}${c('ket')}<td><button class="b d" onclick="cf('Hapus ${esc(s.nama).replace(/'/g,'’')} beserta seluruh nilainya?',()=>{db.siswa=db.siswa.filter(x=>x.id!='${s.id}');sv();render()})">Hapus</button></td></tr>`}).join('')||'<tr><td colspan="8" class="mut">Belum ada peserta didik.</td></tr>';
const Sc=(id,k,v)=>{db.siswa.find(x=>x.id==id)[k]=v;sv()};
function addS(){const n=$('#n2').value.trim();if(!n)return tt('Nama wajib diisi');db.siswa.push({id:uid(),nis:$('#n1').value.trim(),nama:n,jk:$('#n3').value,kelas:$('#n4').value.trim(),absen:$('#n5').value,ket:$('#n6').value});sv();render();tt('Peserta didik ditambahkan')}
function impS(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const L=r.result.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());if(!L.length)return tt('File kosong');const d=(L[0].match(/;/g)||[]).length>(L[0].match(/,/g)||[]).length?';':',';let n=0,sk=0;L.forEach((l,i)=>{const c=l.split(d).map(x=>x.replace(/^"|"$/g,'').trim());if(i==0&&/nama/i.test(c[1]||''))return;if(!c[1]||db.siswa.some(s=>s.nama==c[1]&&s.nis==c[0])){sk++;return}db.siswa.push({id:uid(),nis:c[0],nama:c[1],jk:/^p/i.test(c[2])?'P':'L',kelas:c[3]||db.prof.kelas,absen:c[4]||'',ket:c[5]||''});n++});sv();render();tt(n+' diimpor, '+sk+' dilewati')};r.readAsText(f)}
const expS=()=>xp('peserta-didik.csv',csv(['NIS','Nama','JK','Kelas','Absen','Keterangan'],db.siswa.map(s=>[s.nis,s.nama,s.jk,s.kelas,s.absen,s.ket])));
function expR(){const ks=db.komp.filter(k=>k.pakai&&+k.bobot>0);xp('rekap-nilai.csv',csv(['No','NIS','Nama',...ks.map(k=>k.nama+' ('+k.bobot+'%)'),'Nilai Akhir','Deskripsi'],srt().map((s,i)=>{const r=akhir(s.id);return[i+1,s.nis,s.nama,...ks.map(k=>f1(avgK(s.id,k.id))),r.v!=null?f1(r.v):'',db.desk[s.id]||'']})))}
function addA(){const n=$('#a1').value.trim(),j=$('#a2').value;if(!n)return tt('Nama penilaian wajib diisi');if(!db.komp.length)return tt('Tambahkan komponen di Pengaturan');const a={id:uid(),nama:n,jenis:j,komp:$('#a3').value,tp:$('#a4').value,tgl:$('#a5').value,masuk:j!='Formatif',nil:{},fb:{}};db.ases.push(a);selA=a.id;sv();render()}
function setN(aid,sid,v,el){const a=db.ases.find(x=>x.id==aid);if(v===''){delete a.nil[sid]}else if(isNaN(+v)||+v<0||+v>100){el.value=a.nil[sid]??'';return tt('Nilai harus 0–100')}else a.nil[sid]=+v;sv()}
function rin(sid){const s=db.siswa.find(x=>x.id==sid),r=akhir(sid);md(`<h3>Rincian nilai akhir: ${esc(s.nama)}</h3><table style="min-width:0"><tr><th>Komponen</th><th>Rata-rata</th><th>Bobot</th><th>Kontribusi</th></tr>${r.det.map(d=>`<tr><td>${esc(d[0])}</td><td>${f1(d[1])}</td><td>${d[2]}%</td><td>${f1(d[3])}</td></tr>`).join('')}<tr><th colspan="3">Nilai akhir = Σ (rata-rata × bobot)</th><th>${f1(r.v)}</th></tr></table><p class="mut">Rumus contoh teknis; sesuaikan bobot dengan kebijakan penilaian satuan pendidikan.</p><button class="b" onclick="mc()">Tutup</button>`)}
function gen(s){const R=db.tp.map(t=>[t,tpM(s.id,t.id)]).filter(x=>x[1]!=null);if(!R.length){tt('Belum ada nilai per TP untuk '+s.nama);return''}const b=+db.prof.batas||75,ok=R.filter(x=>x[1]>=(num(x[0].min)??b)),dv=R.filter(x=>x[1]<(num(x[0].min)??b)),ls=a=>a.map(x=>(x[0].teks||x[0].kode).replace(/\.$/,'')).join('; ');return`Ananda ${s.nama} ${ok.length?'menunjukkan capaian yang baik dalam '+ls(ok)+'.':'sedang berproses mengembangkan capaian pada tujuan pembelajaran yang telah dinilai.'} ${dv.length?'Aspek yang masih perlu dikembangkan adalah '+ls(dv)+'; disarankan latihan terbimbing dan umpan balik berkelanjutan.':'Capaian ini dapat dipertahankan dan diperkaya melalui kegiatan pengayaan.'}`}
function impB(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(e){return tt('Berkas bukan JSON yang valid')}if(!o||typeof o.prof!='object'||!['siswa','komp','tp','ases'].every(k=>Array.isArray(o[k])))return tt('Struktur cadangan tidak sesuai');cf('Data saat ini akan diganti dengan isi cadangan.',()=>{db=Object.assign(DEF(),o);sv();go('dash');tt('Cadangan dipulihkan')})};r.readAsText(f)}
(async()=>{const d=await ld();if(d)db=Object.assign(DEF(),d);$('#st').textContent=d?'Data dimuat':'Siap';render()})();
</script>
